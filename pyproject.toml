[project]
name = "constitution-evidence"
version = "1.0.3"
description = "French documentary QA over Morocco's 2011 Constitution"
requires-python = ">=3.11"
dependencies = ["bm25s>=0.2,<0.3"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dense = ["fastembed>=0.7,<1", "faiss-cpu>=1.8,<2"]
generation = ["google-genai>=1,<2", "pydantic>=2,<3"]
groq = [
    "groq>=1.7.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
constitution-evidence = "constitution_evidence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constitution_evidence"]
